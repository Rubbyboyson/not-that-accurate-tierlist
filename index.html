<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Not That Accurate Tierlist</title>
<style>
  :root{
    --bg:#14161A;
    --panel:#1C1F24;
    --card:#20242A;
    --ink:#E9E6DE;
    --ink-soft:#8B8A85;
    --line: rgba(255,255,255,0.09);
    --coral:#E2703A;
    --accent:#3E6E63;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:960px;margin:0 auto;padding:32px 20px 80px;}
  header{margin-bottom:24px;}
  h1{
    font-size:32px;
    margin:0 0 4px;
    letter-spacing:0.5px;
    font-weight:700;
    color:var(--ink);
  }
  .sub{
    font-family: Arial, Helvetica, sans-serif;
    color:var(--ink-soft);
    font-size:14px;
    margin:0;
  }
  .share-note{
    font-family: Arial, Helvetica, sans-serif;
    font-size:12px;
    color:var(--ink-soft);
    background:rgba(255,255,255,0.04);
    border:1px solid var(--line);
    border-radius:4px;
    padding:8px 12px;
    margin:20px 0 28px;
  }

  .add-panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:16px 18px;
    margin-bottom:36px;
  }
  .add-panel h2{
    font-size:16px;
    margin:0 0 12px;
    font-weight:700;
    color:var(--ink);
  }
  .add-row{
    display:flex;
    gap:10px;
    font-family: Arial, Helvetica, sans-serif;
  }
  .add-row input{
    flex:1;
    border:1px solid var(--line);
    border-radius:4px;
    padding:9px 10px;
    font-size:13px;
    font-family: Arial, Helvetica, sans-serif;
    color:var(--ink);
    background:#15171B;
  }
  .add-row input::placeholder{color:var(--ink-soft);}
  .add-btn{
    background:var(--accent);
    color:#F3EEE1;
    border:none;
    border-radius:4px;
    padding:9px 18px;
    font-family: Arial, Helvetica, sans-serif;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
    letter-spacing:0.3px;
  }
  .add-btn:hover{filter:brightness(1.15);}
  .file-btn{
    display:inline-block;
    border:1px dashed var(--line);
    border-radius:4px;
    padding:9px 14px;
    font-family: Arial, Helvetica, sans-serif;
    font-size:13px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .file-btn:hover{color:var(--ink);border-color:var(--coral);}

  .tier{
    display:flex;
    border:1px solid var(--line);
    border-radius:6px;
    margin-bottom:8px;
    background:var(--panel);
    min-height:76px;
    overflow:hidden;
  }
  .tier-label{
    width:64px;
    flex:0 0 64px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    font-weight:700;
    color:#fff;
    text-align:center;
    padding:4px;
  }
  .tier-body{
    flex:1;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:10px;
    align-content:flex-start;
  }
  .tier-body.dragover{background:rgba(255,255,255,0.05);}
  .tier-body.empty::after{
    content:'sleep hier iets naartoe';
    font-family: Arial, Helvetica, sans-serif;
    font-size:12px;
    color:var(--ink-soft);
    align-self:center;
    font-style:italic;
  }

  .pool-section{margin-top:30px;}
  .pool-section h2{
    font-size:16px;
    margin:0 0 10px;
    font-weight:700;
    color:var(--ink);
  }
  .pool{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    min-height:60px;
    padding:12px;
    border:1px dashed var(--line);
    border-radius:6px;
  }
  .pool.dragover{background:rgba(226,112,58,0.08);}

  .item{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:0;
    width:110px;
    height:110px;
    cursor:grab;
    position:relative;
    overflow:hidden;
  }
  .item:active{cursor:grabbing;}
  .item .thumb{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .item .del{
    position:absolute;
    top:3px;
    right:3px;
    background:rgba(0,0,0,0.55);
    border:none;
    color:#F3EEE1;
    width:18px;
    height:18px;
    line-height:18px;
    text-align:center;
    border-radius:3px;
    cursor:pointer;
    font-size:12px;
    padding:0;
    font-family: Arial, Helvetica, sans-serif;
  }
  .item .del:hover{background:var(--coral);}

  .status{
    font-family: Arial, Helvetica, sans-serif;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:6px;
    min-height:16px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Not That Accurate Tierlist</h1>
    <p class="sub">Alles wat we door de jaren heen tegenkomen — af en toe herindelen we 'm samen.</p>
  </header>

  <div class="share-note">Iedereen die deze pagina opent ziet dezelfde lijst en kan afbeeldingen toevoegen of verslepen.</div>

  <div class="add-panel">
    <h2>Iets cools tegengekomen?</h2>
    <div class="add-row">
      <input id="new-image" placeholder="Afbeelding-URL" />
      <button class="add-btn" id="add-btn">Toevoegen</button>
    </div>
    <div class="add-row" style="margin-top:8px;">
      <label class="file-btn" for="new-file">Screenshot / bestand kiezen</label>
      <input id="new-file" type="file" accept="image/*" style="display:none;" />
    </div>
    <div class="status" id="add-status"></div>
  </div>

  <div id="tiers"></div>

  <div class="pool-section">
    <h2>Nog niet ingedeeld</h2>
    <div class="pool" id="pool-unranked"></div>
  </div>

</div>

<script>
/* ============================================================
   INSTELLINGEN — dit moet je zelf invullen
   ============================================================ */
const FIREBASE_DB_URL = "https://not-so-accurate-tierlist-default-rtdb.europe-west1.firebasedatabase.app/"; // bv. https://coolstuff-xxxx-default-rtdb.europe-west1.firebasedatabase.app

const STORAGE_PATH = 'items.json';

const TIERS = [
  {id:'Spp', label:'S++', color:'#8E1B1B'},
  {id:'Sp',  label:'S+',  color:'#B23A2B'},
  {id:'S',   label:'S',   color:'#D9603C'},
  {id:'A',   label:'A',   color:'#C6873F'},
  {id:'B',   label:'B',   color:'#94943F'},
  {id:'C',   label:'C',   color:'#5F7A4A'},
  {id:'D',   label:'D',   color:'#3E6E63'},
  {id:'E',   label:'E',   color:'#3B5A6E'},
  {id:'F',   label:'F',   color:'#4A5568'},
  {id:'Fm',  label:'F-',  color:'#33383F'},
];

let items = [];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function dbUrl(){
  return FIREBASE_DB_URL.replace(/\/$/, '') + '/' + STORAGE_PATH;
}

async function loadItems(){
  if(FIREBASE_DB_URL.includes('PLAK_HIER')){
    setStatus('Nog geen database gekoppeld — zie de instructies.');
    render();
    return;
  }
  try{
    const res = await fetch(dbUrl());
    const data = await res.json();
    items = Array.isArray(data) ? data.filter(Boolean) : (data ? Object.values(data) : []);
  }catch(e){
    setStatus('Kon de lijst niet laden. Controleer je internetverbinding.');
    items = [];
  }
  render();
}

async function saveItems(){
  try{
    await fetch(dbUrl(), {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(items)
    });
  }catch(e){
    setStatus('Opslaan mislukt, probeer opnieuw.');
  }
}

function setStatus(msg){
  document.getElementById('add-status').textContent = msg;
  if(msg) setTimeout(()=>{ document.getElementById('add-status').textContent=''; }, 2500);
}

function buildTiers(){
  const container = document.getElementById('tiers');
  container.innerHTML = '';
  TIERS.forEach(t=>{
    const row = document.createElement('div');
    row.className = 'tier';
    row.innerHTML = `
      <div class="tier-label" style="background:${t.color}">${t.label}</div>
      <div class="tier-body" data-tier="${t.id}"></div>
    `;
    container.appendChild(row);
  });
  attachDropzones();
}

function attachDropzones(){
  const zones = [...document.querySelectorAll('.tier-body'), document.getElementById('pool-unranked')];
  zones.forEach(zone=>{
    zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave', ()=> zone.classList.remove('dragover'));
    zone.addEventListener('drop', async e=>{
      e.preventDefault();
      zone.classList.remove('dragover');
      const id = e.dataTransfer.getData('text/plain');
      const item = items.find(i=>i.id===id);
      if(!item) return;
      item.tier = zone.dataset.tier || null;
      await saveItems();
      render();
    });
  });
}

function escapeAttr(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function itemCard(item){
  const el = document.createElement('div');
  el.className = 'item';
  el.draggable = true;
  el.dataset.id = item.id;
  el.innerHTML = `
    <img class="thumb" src="${escapeAttr(item.image)}" alt="" onerror="this.parentElement.remove()" />
    <button class="del" data-id="${item.id}">✕</button>
  `;
  el.addEventListener('dragstart', e=>{
    e.dataTransfer.setData('text/plain', item.id);
  });
  el.querySelector('.del').addEventListener('click', async ()=>{
    items = items.filter(i=>i.id !== item.id);
    await saveItems();
    render();
  });
  return el;
}

function render(){
  document.querySelectorAll('.tier-body').forEach(zone=>{
    zone.innerHTML = '';
    zone.classList.remove('empty');
    const tierItems = items.filter(i=>i.tier === zone.dataset.tier);
    if(tierItems.length === 0){ zone.classList.add('empty'); }
    tierItems.forEach(i=> zone.appendChild(itemCard(i)));
  });
  const pool = document.getElementById('pool-unranked');
  pool.innerHTML = '';
  const poolItems = items.filter(i=>!i.tier);
  if(poolItems.length === 0){
    pool.innerHTML = '<span style="font-family:Arial,sans-serif;font-size:12px;color:var(--ink-soft);font-style:italic;">nog niets toegevoegd</span>';
  }
  poolItems.forEach(i=> pool.appendChild(itemCard(i)));
}

document.getElementById('add-btn').addEventListener('click', async ()=>{
  const imageEl = document.getElementById('new-image');
  const image = imageEl.value.trim();
  if(!image){ setStatus('Plak eerst een afbeelding-URL.'); return; }
  const item = { id: uid(), image, tier: null, addedAt: Date.now() };
  items.push(item);
  await saveItems();
  imageEl.value='';
  setStatus('Toegevoegd.');
  render();
});

buildTiers();
loadItems();
</script>
</body>
</html>
